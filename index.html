<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Partbook</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
       <header class="site-header">
        <a class="logo" href="/">Partbook</a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="#projects">Projects</a>
        <button type="button">Light mode</button>
        </nav>

       </header>

       <main>
       <section id="projects" class="projects-section">
        <p class="section-label">Ledger</p>
        <h1>Projects</h1>
        <p class="section-note"> Every project has its own bill of materials. </p>
        <div class="project-grid">
        <article class="project-card">
            <div class="card-topline">
                <span class="card-number">01</span>
                <span class="card-symbol">◆</span>
            </div>

            <h2>Robot Arm v2</h2>

            <p> Six servos, aluminium, one very patient weekend. </p>

            <div class="card-details">
                <div>
                    <span>Items</span>
                    <strong>0</strong>
                </div>
                <div>
                    <span>Units</span>
                    <strong>0</strong>

                </div>
            </div>

            <div class="card-total">
                <span>Total</span>
                <strong>£0.00</strong>
            </div>
            
        </article>
        <button class="project-card new-card" type="button ">
            <span class="plus">+</span>
            <span>New project</span>
        </button>
        </div>
       </section>
       </main>
    </body>

</html>
